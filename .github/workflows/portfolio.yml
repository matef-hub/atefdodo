name: Portfolio validation and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'scripts/validate_portfolio.py'
      - '.github/workflows/portfolio.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'scripts/validate_portfolio.py'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "portfolio-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site and SVG
        run: python3 scripts/validate_portfolio.py
      - name: Check JavaScript syntax
        run: node --check docs/app.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect whether Pages is enabled for GitHub Actions
        id: pages_status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sSL -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ] && jq -e '.build_type == "workflow"' /tmp/pages.json >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not yet configured for GitHub Actions. Enable it in Settings > Pages."
          fi
      - name: Configure GitHub Pages
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        if: steps.pages_status.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
