name: Portfolio validation and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'scripts/validate_portfolio.py'
      - '.github/workflows/portfolio.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'scripts/validate_portfolio.py'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "portfolio-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site and SVG
        run: python3 scripts/validate_portfolio.py
      - name: Check JavaScript syntax
        run: node --check docs/app.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (requires repository Pages setup)
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
